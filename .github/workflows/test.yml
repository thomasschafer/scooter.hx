name: Test

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Cache minimal Helix runtime
        if: runner.os != 'Windows'
        id: helix-runtime-cache
        uses: actions/cache@v4
        with:
          path: .ci/helix-runtime
          # runner.os in the key: grammar dylibs are platform binaries, and a
          # cross-OS cache hit loads unloadable artifacts.
          key: helix-runtime-${{ runner.os }}-0522d519-${{ hashFiles('scripts/ci/assemble-runtime.sh') }}

      - name: Assemble minimal Helix runtime
        if: runner.os != 'Windows' && steps.helix-runtime-cache.outputs.cache-hit != 'true'
        run: scripts/ci/assemble-runtime.sh .ci/helix-runtime
        shell: bash

      # The tmux/Helix e2e harness needs a locally built Helix from the
      # steel-event-system branch, so it deliberately remains local-only.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests with the Helix runtime
        if: runner.os != 'Windows'
        env:
          HELIX_RUNTIME: ${{ github.workspace }}/.ci/helix-runtime
          REQUIRE_HELIX_RUNTIME: "1"
        run: cargo test --workspace

      # Windows runners do not guarantee the C toolchain Helix grammars need.
      # Runtime-backed tests therefore skip there; all other tests still run.
      - name: Run tests without the Helix runtime
        if: runner.os == 'Windows'
        run: cargo test --workspace

      - name: Check generated README
        run: cargo xtask readme --check
