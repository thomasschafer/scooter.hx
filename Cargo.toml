[package]
name = "scooter-hx-engine"
version = "0.1.4"
edition = "2024"
rust-version = "1.89"

[lib]
name = "scooter_hx"
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11.1"
steel-core = { git = "https://github.com/mattwparas/steel.git", rev = "dec633b908afeafeaf62bab457a92e2bf873745a", features = ["dylibs", "sync"] }
steel-derive = { git = "https://github.com/mattwparas/steel.git", rev = "dec633b908afeafeaf62bab457a92e2bf873745a" }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
manual_string_new = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_else = "allow"
if_not_else = "allow"
needless_raw_string_hashes = "allow"
bool_assert_comparison = "allow"
similar_names = "allow"

[lints.rust]
rust_2018_idioms = "warn"
