[package]
name = "scooter-hx-engine"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"

[lib]
name = "scooter_hx"
crate-type = ["cdylib", "rlib"]

[workspace]
members = ["xtask"]
resolver = "3"

[dependencies]
abi_stable = "0.11.1"
etcetera = "0.11.0"
log = "0.4.30"
lru = "0.18.1"
scooter-core = "0.4.0"
simple-log = "2.4.0"
steel-core = { git = "https://github.com/mattwparas/steel.git", rev = "dec633b908afeafeaf62bab457a92e2bf873745a", features = ["dylibs", "sync"] }
steel-derive = { git = "https://github.com/mattwparas/steel.git", rev = "dec633b908afeafeaf62bab457a92e2bf873745a" }
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
ropey = "=1.6.1"
regex = "1.12.3"
toml = "1.1.0"
tree-house = { version = "=0.4.0", default-features = false }
tree-house-bindings = "=0.3.2"
unicode-width = "0.2.0"

[dev-dependencies]
insta = { version = "1.47.2", features = ["filters"] }
tempfile = "3.27.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
manual_string_new = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_else = "allow"
if_not_else = "allow"
needless_raw_string_hashes = "allow"
bool_assert_comparison = "allow"
similar_names = "allow"

[lints.rust]
rust_2018_idioms = "warn"
